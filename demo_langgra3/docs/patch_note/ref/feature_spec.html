<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Builder — 기능 명세표</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0f12;
    --surface: #13161b;
    --surface2: #1a1e25;
    --border: #252a33;
    --border2: #2e3540;
    --accent: #4af0a0;
    --accent2: #2dd4bf;
    --warn: #f0a04a;
    --danger: #f05a4a;
    --removed: #6b7280;
    --text: #d1d8e4;
    --text2: #7a8899;
    --text3: #4a5568;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  header span {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text3);
  }
  .header-right {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .legend {
    display: flex;
    gap: 12px;
    align-items: center;
    font-family: var(--mono);
    font-size: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; color: var(--text2); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
  }
  .dot-done   { background: var(--accent); }
  .dot-partial { background: var(--warn); }
  .dot-none   { background: var(--danger); }
  .dot-removed { background: var(--removed); }

  /* ── Layout ── */
  .layout {
    display: flex;
    height: calc(100vh - 65px);
  }

  /* ── Sidebar Nav ── */
  nav {
    width: 196px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 16px 0;
    overflow-y: auto;
  }
  .nav-label {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0 16px 8px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 16px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 14px;
    text-align: left;
    transition: all 0.12s;
    border-left: 2px solid transparent;
  }
  .nav-btn:hover { color: var(--text); background: var(--surface2); }
  .nav-btn.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(74,240,160,0.05);
  }
  .nav-icon {
    font-size: 15px;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .nav-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── Main Content ── */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  .section { display: none; }
  .section.active { display: block; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .section-subtitle {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* ── Table ── */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead tr {
    background: var(--surface2);
    border-bottom: 1px solid var(--border2);
  }
  thead th {
    padding: 9px 12px;
    text-align: left;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    user-select: none;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 8px 12px;
    vertical-align: middle;
    color: var(--text);
  }

  /* editable cells */
  td[contenteditable="true"] {
    outline: none;
    cursor: text;
    transition: background 0.1s;
    min-width: 60px;
  }
  td[contenteditable="true"]:focus {
    background: rgba(74,240,160,0.06);
    box-shadow: inset 0 0 0 1px rgba(74,240,160,0.3);
  }

  /* ── Status Badge ── */
  .status-cell { white-space: nowrap; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.1s;
  }
  .status-badge:hover { opacity: 0.8; }
  .s-done    { background: rgba(74,240,160,0.12);  color: var(--accent); }
  .s-partial { background: rgba(240,160,74,0.12);  color: var(--warn); }
  .s-none    { background: rgba(240,90,74,0.12);   color: var(--danger); }
  .s-removed { background: rgba(107,114,128,0.12); color: var(--removed); }

  /* file chip */
  .file-chip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--text2);
    margin: 1px 2px;
  }

  /* note cell */
  .note-cell {
    color: var(--text2);
    font-size: 13px;
    max-width: 260px;
  }

  /* ── Row Actions ── */
  .row-actions {
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
  }
  tr:hover .row-actions { opacity: 1; }

  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1;
    transition: background 0.1s;
    color: var(--text2);
  }
  .btn-icon:hover { background: var(--border2); color: var(--text); }
  .btn-icon.del:hover { background: rgba(240,90,74,0.15); color: var(--danger); }

  /* ── Add Row Button ── */
  .add-row-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    background: none;
    border: 1px dashed var(--border2);
    border-radius: 4px;
    padding: 7px 14px;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
  }
  .add-row-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(74,240,160,0.04);
  }

  /* ── Stats Bar ── */
  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 18px;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
  }
  .stat-num {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .stat-label { color: var(--text3); font-size: 12px; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn-sm {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.primary {
    background: rgba(74,240,160,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--accent);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 4px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>

</header>

  <main id="main"></main>

<div id="toast"></div>

    title: 'specs 목표 대비 미구현',
    files: [],
    rows: [
      { item: '엣지 흐름 실시간 시각화 (Visual Tracing)', status: 'none',    files: [], note: '실시간 구동 테스트 기능 도입 시 재검토. 현재는 셀 상태 표시로 대체' },
      { item: '실행 결과 스냅샷 렌더링 (이미지·텍스트·JSON)', status: 'partial', files: ['inspector.js', 'inspector.css'], note: 'Result 탭에 텍스트 결과 표시. 이미지·바이너리 렌더링 미구현' },
      { item: '멀티모달 프롬프트 입력 (이미지·음원 등)',       status: 'none',    files: ['inspector.js'], note: '현재 텍스트만 지원. 추후 파일 첨부 방식으로 이미지·음원 등 추가 예정' },
      { item: '셀 내부 미니 프로그레스바',                     status: 'partial', files: ['canvas.js', 'cell.css'], note: 'inject→search→generate→validate→execute 단계를 셀 하단 점/바로 표시. 버그로 보류 중' },
      { item: '온보딩 오버레이',                           status: 'none',    files: ['overlays.css', 'ui.js'],      note: '첫 진입 시 셀 추가→연결→실행 3단계 가이드. 이후 진입 시 스킵 가능' },
      { item: 'Inspector 평어 레이블',                      status: 'none',    files: ['inspector.js', 'inspector.css'], note: '기술 용어를 평어로 병행 표시. ex) upstream_schema → "이전 셀에서 받는 데이터"' },
      { item: '셀 템플릿 선택',                             status: 'none',    files: ['canvas.js', 'ui.js'],         note: '셀 추가 시 미리 채워진 프롬프트 선택 옵션. ex) 이미지 처리·텍스트 요약 등' },
      { item: '도움말 창',                                  status: 'none',    files: ['ui.js', 'overlays.css'],      note: '사용 방법·기능 목록 안내. 헤더 또는 단축키로 접근 가능' },
      { item: '분기 셀 (Branch Cell) — 마름모 형태',       status: 'none',    files: ['canvas.js', 'cell.css'], note: 'JSON Schema 필드 타입/값 기반 경로 분기. 트레이·우클릭으로 추가' },
      { item: 'Broadcasting / Aggregating 전략',          status: 'none',    files: ['canvas.js', 'runner.js'], note: '캔버스 연결 구조(1:N, N:1)를 분석해 LLM 코드 생성 시 병렬 패턴(asyncio·Promise.all 등) 자동 적용. 코드 생성 순서는 순차 유지' },
      { item: 'JSON Schema 기반 I/O assertion UI',         status: 'none',    files: ['inspector.js', 'inspector.css'], note: '필드명·타입·필수여부 테이블 편집기. 언어 무관 셀 간 계약' },
      { item: 'Project Config 트레이 (Skill.md 전역 설정)', status: 'none',    files: ['canvas.js', 'inspector.js'], note: '툴 트레이와 구분선으로 분리된 별도 아이콘. 프로젝트 전체 셀에 skill 적용' },
      { item: '파이프라인 단일 파일 Export',                status: 'none',    files: ['runner.js'], note: '연결 순서 기준으로 각 셀 코드를 묶어 단일 실행 파일로 다운로드' },
    ]
  },
];

// ── State ──
let data = JSON.parse(localStorage.getItem('pipeline-spec') || 'null') || JSON.parse(JSON.stringify(SECTIONS));
let activeSection = data[0].id;

// ── Persist ──
function save() {
  localStorage.setItem('pipeline-spec', JSON.stringify(data));
}

// ── Toast ──
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── Status cycle ──
function statusInfo(key) {
  return STATUSES.find(s => s.key === key) || STATUSES[0];
}
function nextStatus(key) {
  const idx = STATUSES.findIndex(s => s.key === key);
  return STATUSES[(idx + 1) % STATUSES.length].key;
}

// ── Count stats ──
function sectionStats(rows) {
  const counts = { done: 0, partial: 0, none: 0, removed: 0 };
  rows.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
  return counts;
}

// ── Render Nav ──
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '<div class="nav-label">영역</div>';
  data.forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (sec.id === activeSection ? ' active' : '');
    btn.innerHTML = `<span class="nav-icon">${sec.icon}</span><span>${sec.title}</span><span class="nav-count">${sec.rows.length}</span>`;
    btn.onclick = () => { activeSection = sec.id; renderAll(); };
    nav.appendChild(btn);
  });
}

// ── Render Table ──
function renderSection(sec) {
  const stats = sectionStats(sec.rows);
  const total = sec.rows.length;

  return `
  <div class="section ${sec.id === activeSection ? 'active' : ''}" id="sec-${sec.id}">
    <div class="section-header">
      <div>
        <div class="section-title">${sec.icon} ${sec.title}</div>
        <div class="section-subtitle">총 ${total}개 항목</div>
      </div>
      <div class="toolbar">
        <button class="btn-sm" onclick="exportSection('${sec.id}')">내보내기</button>
        <button class="btn-sm primary" onclick="addRow('${sec.id}')">+ 행 추가</button>
      </div>
    </div>

    <div class="stats-bar">
      ${stats.done    ? `<div class="stat-chip"><span class="dot dot-done"></span><div><div class="stat-num">${stats.done}</div><div class="stat-label">구현완료</div></div></div>` : ''}
      ${stats.partial ? `<div class="stat-chip"><span class="dot dot-partial"></span><div><div class="stat-num">${stats.partial}</div><div class="stat-label">부분구현</div></div></div>` : ''}
      ${stats.none    ? `<div class="stat-chip"><span class="dot dot-none"></span><div><div class="stat-num">${stats.none}</div><div class="stat-label">미구현</div></div></div>` : ''}
      ${stats.removed ? `<div class="stat-chip"><span class="dot dot-removed"></span><div><div class="stat-num">${stats.removed}</div><div class="stat-label">제거됨</div></div></div>` : ''}
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:32%">항목</th>
            <th style="width:13%">상태</th>
            <th style="width:25%">담당 파일</th>
            <th>비고</th>
            <th style="width:56px"></th>
          </tr>
        </thead>
        <tbody id="tbody-${sec.id}">
          ${sec.rows.map((row, i) => renderRow(sec.id, row, i)).join('')}
        </tbody>
      </table>
    </div>
    <button class="add-row-btn" onclick="addRow('${sec.id}')">＋ 새 항목 추가</button>
  </div>`;
}

function renderRow(secId, row, idx) {
  const si = statusInfo(row.status);
  const filesHtml = (row.files || []).map(f => `<span class="file-chip">${f}</span>`).join('');
  return `
  <tr id="row-${secId}-${idx}">
    <td contenteditable="true" onblur="updateCell('${secId}',${idx},'item',this.innerText.trim())">${escHtml(row.item)}</td>
    <td class="status-cell">
      <span class="status-badge ${si.cls}" onclick="cycleStatus('${secId}',${idx})" title="클릭하여 상태 변경">${si.label}</span>
    </td>
    <td contenteditable="true" onblur="updateFiles('${secId}',${idx},this.innerText.trim())" title="쉼표로 구분">${(row.files || []).join(', ')}</td>
    <td class="note-cell" contenteditable="true" onblur="updateCell('${secId}',${idx},'note',this.innerText.trim())">${escHtml(row.note || '')}</td>
    <td class="row-actions">
      <button class="btn-icon del" onclick="deleteRow('${secId}',${idx})" title="삭제">✕</button>
    </td>
  </tr>`;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Render All ──
function renderAll() {
  renderNav();
  document.getElementById('main').innerHTML = data.map(renderSection).join('');
}

// ── Mutations ──
function getSec(id) { return data.find(s => s.id === id); }

function updateCell(secId, idx, field, val) {
  getSec(secId).rows[idx][field] = val;
  save();
}

function updateFiles(secId, idx, val) {
  getSec(secId).rows[idx].files = val.split(',').map(s => s.trim()).filter(Boolean);
  save();
}

function cycleStatus(secId, idx) {
  const row = getSec(secId).rows[idx];
  row.status = nextStatus(row.status);
  save();
  // re-render just the badge
  const si = statusInfo(row.status);
  const badge = document.querySelector(`#row-${secId}-${idx} .status-badge`);
  if (badge) {
    badge.className = `status-badge ${si.cls}`;
    badge.textContent = si.label;
  }
  renderNav(); // update counts
  toast(`상태 변경 → ${si.label}`);
}

function addRow(secId) {
  const sec = getSec(secId);
  sec.rows.push({ item: '새 항목', status: 'none', files: [], note: '' });
  save();
  renderAll();
  // focus new row item cell
  setTimeout(() => {
    const tbody = document.getElementById(`tbody-${secId}`);
    if (tbody) {
      const lastRow = tbody.lastElementChild;
      if (lastRow) {
        const cell = lastRow.querySelector('td[contenteditable]');
        if (cell) { cell.focus(); selectAll(cell); }
      }
    }
  }, 50);
  toast('항목 추가됨');
}

function selectAll(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function deleteRow(secId, idx) {
  const sec = getSec(secId);
  if (sec.rows.length <= 1) { toast('마지막 항목은 삭제할 수 없어요'); return; }
  sec.rows.splice(idx, 1);
  save();
  renderAll();
  toast('항목 삭제됨');
}

function exportSection(secId) {
  const sec = getSec(secId);
  const lines = [
    `## ${sec.title}`,
    '',
    '| 항목 | 상태 | 담당 파일 | 비고 |',
    '|---|---|---|---|',
    ...sec.rows.map(r => {
      const si = statusInfo(r.status);
      return `| ${r.item} | ${si.label} | ${(r.files||[]).join(', ')} | ${r.note||''} |`;
    }),
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `spec-${secId}.md`;
  a.click();
  toast('마크다운으로 내보냄');
}

// ── Init ──
renderAll();
</script>
</body>
</html>
